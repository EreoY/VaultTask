# ==============================================================================
# Nginx Reverse Proxy Configuration for Calenda / VaultTask Application
# ==============================================================================
# Installation / Usage:
# 1. Copy or link this configuration to Nginx:
#    sudo cp nginx-calenda.conf /etc/nginx/sites-available/calenda
#    sudo ln -s /etc/nginx/sites-available/calenda /etc/nginx/sites-enabled/
# 2. Adjust 'listen' or 'server_name' if binding to a specific VPN IP (e.g. listen 10.8.0.2:80;)
# 3. Verify Nginx configuration syntax:
#    sudo /usr/sbin/nginx -t
# 4. Reload Nginx service:
#    sudo systemctl reload nginx
# ==============================================================================

# Map HTTP Upgrade header for WebSocket proxying
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Maximum client upload size for audio files / attachments
    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # 1. Frontend Web App (Flutter Web Server)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for Flutter web dev server)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # --------------------------------------------------------------------------
    # 2. Backend API & WebSocket (Cloudflare Worker / Wrangler)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
